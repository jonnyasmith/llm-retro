<title>PROTOTYPE — Metrics + Insights Viewer (#7 / #8)</title>
<!--
  THROWAWAY PROTOTYPE for the v1 viewers — metrics (#7) and retro/insights (#8),
  two views over one shared, filtered dataset.
  Question: how should each viewer look/behave, which Signals (#4) + Inferences (#6)
  surface and how, and how the two coordinate (shared nav/filters/selection).

  Chosen design: single header nav — Overview | Sessions | Insights | Jobs.
  · Overview — question-driven metrics layout (latency hero); session-shape scatter drills to Sessions.
  · Sessions — master-detail per-session Signal breakdown; links across to Insights.
  · Insights (#8) — the LLM Inference layer over the same filtered set. THREE variants to
    choose from via the in-page Layout switch (?insight=A|B|C), all over the same data:
      A · Digest — opinionated retro report: headline findings, ranked themes, dumb-zone chart.
      B · Workbench — session-first annotated transcript; each Inference sits inline on its Turn.
      C · Explorer — theme/pattern-first; drill a pattern to its supporting per-session evidence.
    Every variant shows the Inference contract (refs back to Turn/Message, evidence excerpt,
    provenance stamp + non-authoritative marker) and cross-links to Sessions via "View metrics →".
  · Jobs (#5) — control-plane stub.
  Filters + view persist via ?view=. All mock data, in-memory, no persistence.
  (Earlier A/B/C/S metrics layout variants live in this branch's git history.)
  Run: `open docs/prototypes/metrics-viewer.html` (macOS) or drop it in a browser.
  Not production code — no SvelteKit, no build, no tests. Fold the winner into the
  real app when the spec lands.
-->
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

<div id="app" class="app"></div>

<script>
/* =====================================================================
   MOCK DATA  — deterministic, in-memory. Encodes the 8 v1 Signals (#4).
   ===================================================================== */
let _seed = 1337;
function rnd() { _seed = (_seed * 1664525 + 1013904223) % 4294967296; return _seed / 4294967296; }
function pick(a) { return a[Math.floor(rnd() * a.length)]; }
function ri(lo, hi) { return lo + Math.floor(rnd() * (hi - lo + 1)); }

const TOOLS = ["claude", "codex", "pi"];
const MODELS = {
  claude: ["claude-opus-4", "claude-sonnet-4"],
  codex:  ["gpt-5-codex", "o4-mini"],
  pi:     ["claude-opus-4", "gpt-5-codex", "llama-3.3-70b"],
};
const TOOLNAMES = ["read", "edit", "bash", "grep", "glob", "write", "task", "lsp"];
const TASKS = ["refactor auth module","debug latency regression","add ECharts viewer","port config loader",
  "write migration","triage flaky tests","implement job runner","normalise session model","review PR #204",
  "wire Docker socket","extract signals job","fix pgvector index","spec metrics viewer","dictate retro notes"];

const NOW = new Date("2026-07-18T18:00:00Z");
function daysAgo(d, hourLocal) {
  const dt = new Date(NOW); dt.setUTCDate(dt.getUTCDate() - d);
  dt.setUTCHours(hourLocal, ri(0,59), 0, 0); return dt;
}

function makeSession(i) {
  const tool = pick(TOOLS);
  const models = MODELS[tool];
  const day = ri(0, 20);
  // start hour skews toward working hours; some afternoon sessions
  const startHour = pick([9,10,10,11,13,14,14,15,16,16,20,21]);
  const start = daysAgo(day, startHour);
  const turns = ri(4, 60);
  const durationMin = Math.round(turns * (rnd() * 2.4 + 0.8) + ri(0, 25));
  const kind = rnd() < 0.18 ? "subagent" : "root";

  // model mix: primary model + occasional secondary
  const primary = pick(models);
  const secondary = rnd() < 0.4 ? pick(models.filter(m => m !== primary)) : null;
  const mix = {};
  if (secondary) { const s = rnd()*0.4+0.15; mix[primary]=1-s; mix[secondary]=s; }
  else mix[primary] = 1;

  // tokens — codex is reconstructed (basis)
  const inTok = ri(20000, 900000), outTok = ri(8000, 220000), cacheTok = ri(0, 1500000);
  const basis = tool === "codex" ? "reconstructed" : "exact";

  // subagents
  const subCount = kind === "root" ? (rnd() < 0.5 ? ri(1, 6) : 0) : 0;
  const subTokens = subCount ? ri(30000, 400000) * subCount : 0;

  // tool usage
  const tools = {}; const nTools = ri(2, 6);
  for (let t = 0; t < nTools; t++) { const n = pick(TOOLNAMES); tools[n] = (tools[n]||0) + ri(1, 40); }

  // latency samples: per model-response gap. AFTERNOON slowdown baked into per-token rate.
  const nLat = Math.min(turns, ri(6, 40));
  const latency = [];
  let activeMs = 0;
  for (let s = 0; s < nLat; s++) {
    const inst = new Date(start.getTime() + s * (durationMin*60000/nLat));
    const hourLocal = (inst.getUTCHours() + 1) % 24; // Europe/London ~ +1 (DST) mock
    const outT = ri(120, 3800);
    // base rate ms/token, afternoon (13-17) penalty
    let rate = 5.5 + rnd()*2.5;
    if (hourLocal >= 13 && hourLocal <= 17) rate *= 1.32 + rnd()*0.25;
    if (hourLocal >= 22 || hourLocal <= 6) rate *= 1.08;
    const ms = Math.round(outT * rate + ri(300, 1500));
    latency.push({ instant: inst, ms, outTokens: outT });
    activeMs += ms;
  }

  return {
    id: "S" + String(i).padStart(3, "0"),
    title: pick(TASKS), tool, kind, start, durationMin, turns, mix,
    tokens: { in: inTok, out: outTok, cache: cacheTok, basis },
    subagents: { count: subCount, tokens: subTokens },
    tools, latency, activeMs,
    dominantModel: primary,
  };
}
const ALL = Array.from({ length: 64 }, (_, i) => makeSession(i + 1));

/* =====================================================================
   MOCK INFERENCE LAYER (#6/#8) — LLM-derived, non-authoritative, stamped.
   Per-session: course-corrections, input-noise waste, dumb-zone detection.
   Cross-session: thematic synthesis (LLM) + dumb-zone aggregate (deterministic).
   Each Inference carries the stored contract the viewer forces concrete:
   refs back to Turns/Messages, an evidence excerpt, confidence, a provenance
   stamp (model, prompt-version, extractor-version, ran-at), authoritative:false.
   ===================================================================== */
const EXTRACTOR_V = "0.4.1";
const CC = [
  { s: "Redirected the model away from rewriting the working parser.", e: "no — don't touch the parser, just add the flag" },
  { s: "Halted an unrequested refactor of the auth flow.",            e: "stop, that's not what I asked. revert that." },
  { s: "Corrected a wrong assumption about the DB schema.",           e: "the column already exists, check the migration" },
  { s: "Re-scoped after the model over-engineered the solution.",     e: "this is way too much — just the one function" },
  { s: "Stopped the model deleting tests it misread as dead.",        e: "those tests are used, leave them" },
  { s: "Pulled the model back after it invented a config key.",       e: "that option doesn't exist, read the schema" },
];
const NOISE = [
  { s: "Dictation garbled 'auth' → 'oath'; model built OAuth for 2 turns.", e: "add oath to teh login page", fix: "add auth to the login page" },
  { s: "Typo 'delete' → 'dilate' sent it down an image path.",              e: "can you dilate the old rows",  fix: "can you delete the old rows" },
  { s: "Dropped word left the request ambiguous; model guessed wrong.",     e: "make it work the the config",  fix: "make it read from the config" },
];
const DZ = "Quality degraded past ~{K}k ctx tokens: re-suggested an edit from 20 turns back, lost track of the file it had changed.";
function inf(type, s, turn, obj, promptV, conf) {
  return {
    id: `INF-${s.id}-${type}-${turn}`,
    type, sessionId: s.id,
    turnRef: turn, messageRef: `${s.id}:M${turn * 2}`,
    summary: obj.s, evidence: obj.e, correctedTo: obj.fix || null,
    confidence: conf,
    authoritative: false,
    provenance: { model: s.dominantModel, promptVersion: promptV, extractorVersion: EXTRACTOR_V,
      ranAt: new Date(NOW.getTime() - ri(1, 40) * 3600000), rawResponseRef: `resp://${s.id}/${type}` },
  };
}
ALL.forEach(s => {
  const infs = [];
  const nCC = rnd() < 0.75 ? ri(1, Math.min(4, Math.ceil(s.turns / 12))) : 0;
  const usedT = new Set();
  for (let k = 0; k < nCC; k++) { let t; do { t = ri(2, s.turns); } while (usedT.has(t)); usedT.add(t);
    infs.push(inf("course-correction", s, t, CC[ri(0, CC.length - 1)], "cc@3", +(0.62 + rnd() * 0.34).toFixed(2))); }
  const nNoise = rnd() < 0.38 ? ri(1, 2) : 0;
  for (let k = 0; k < nNoise; k++) { let t; do { t = ri(1, s.turns); } while (usedT.has(t)); usedT.add(t);
    infs.push(inf("input-noise", s, t, NOISE[ri(0, NOISE.length - 1)], "noise@2", +(0.55 + rnd() * 0.34).toFixed(2))); }
  // dumb-zone DETECTION (per session): degradation point in cumulative ctx tokens, or null
  let dz = null;
  if (s.turns > 22 && rnd() < 0.5) {
    const kTok = ri(34, 128);
    const t = ri(Math.ceil(s.turns * 0.55), s.turns);
    dz = inf("dumb-zone", s, t, { s: DZ.replace("{K}", kTok), e: "you already changed that file — see turn " + (t - 18) }, "dz@2", +(0.6 + rnd() * 0.3).toFixed(2));
    dz.degradedAtTokens = kTok * 1000;
    infs.push(dz);
  }
  s.inferences = infs;
  s.dumbZone = dz; // the per-session dumb-zone Inference (or null = never degraded)
});
// dumb-zone AGGREGATE — deterministic distribution over per-session degradation points → threshold
function dumbZoneAggregate(sessions) {
  const pts = sessions.filter(s => s.dumbZone).map(s => s.dumbZone.degradedAtTokens).sort((a, b) => a - b);
  const median = pts.length ? pts[Math.floor(pts.length / 2)] : null;
  return { points: pts, threshold: median, detected: pts.length, total: sessions.length };
}

/* ---------- aggregation helpers ---------- */
const fmtK = n => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(0)+"k" : ""+n;
const fmtMin = m => m >= 60 ? (m/60).toFixed(1)+"h" : m+"m";
function agg(sessions) {
  const a = {
    sessions: sessions.length, turns: 0,
    tokIn: 0, tokOut: 0, tokCache: 0, reconShare: 0,
    subCount: 0, subTokens: 0, totalTokens: 0,
    durationMin: 0, activeMs: 0,
    modelTokens: {}, toolCounts: {}, latByHour: Array.from({length:24},()=>({sumMs:0,sumTok:0,n:0})),
  };
  let reconTok = 0;
  sessions.forEach(s => {
    a.turns += s.turns;
    a.tokIn += s.tokens.in; a.tokOut += s.tokens.out; a.tokCache += s.tokens.cache;
    const tt = s.tokens.in + s.tokens.out;
    a.totalTokens += tt; if (s.tokens.basis === "reconstructed") reconTok += tt;
    a.subCount += s.subagents.count; a.subTokens += s.subagents.tokens;
    a.durationMin += s.durationMin; a.activeMs += s.activeMs;
    Object.entries(s.mix).forEach(([m, share]) => a.modelTokens[m] = (a.modelTokens[m]||0) + tt*share);
    Object.entries(s.tools).forEach(([t, c]) => a.toolCounts[t] = (a.toolCounts[t]||0) + c);
    s.latency.forEach(l => {
      const h = (l.instant.getUTCHours() + 1) % 24;
      a.latByHour[h].sumMs += l.ms; a.latByHour[h].sumTok += l.outTokens; a.latByHour[h].n++;
    });
  });
  a.reconShare = a.totalTokens ? reconTok / a.totalTokens : 0;
  return a;
}
function hourSeries(a, mode) {
  return a.latByHour.map(h => !h.n ? null :
    mode === "perToken" ? +(h.sumMs / h.sumTok).toFixed(2) : +(h.sumMs / h.n / 1000).toFixed(2));
}

function turnThread(s) {

  return infs.map((i, idx) => {
    const m = INFMETA[i.type];
    const gapN = idx === 0 ? i.turnRef - 1 : i.turnRef - infs[idx - 1].turnRef - 1;
    const gap = gapN > 0 ? `<div class="tgap">⋯ ${gapN} turn${gapN > 1 ? "s" : ""} without a flag</div>` : "";
    return `${gap}<div class="tturn" id="turn-${i.turnRef}">
      <div class="tnum">Turn ${i.turnRef}<div class="tref pmono">${i.messageRef}</div></div>
      <div class="tbody">
        <div class="tmsg user"><span class="who">you</span> ${i.evidence}</div>
        <div class="tmsg ai"><span class="who">${s.dominantModel}</span> <span class="dim">…the response you then redirected…</span></div>
        <div class="annot" style="border-left-color:${m.color}">
          <div class="row"><span class="itag" style="color:${m.color}">${m.icon} ${m.label}</span>
            <span class="spacer" style="flex:1"></span><span class="conf">conf ${(i.confidence*100).toFixed(0)}%</span></div>
          <div class="isum">${i.summary}</div>
          ${i.correctedTo ? `<div class="fix">heard <s>${i.evidence}</s> → meant <b>${i.correctedTo}</b></div>` : ""}
          ${i.degradedAtTokens ? `<div class="dim pmono">degraded @ ~${fmtK(i.degradedAtTokens)} ctx tokens</div>` : ""}
          ${provStamp(i.provenance)}</div>
      </div></div>`;
  }).join("");
}

/* ---- Variant C: EXPLORER — theme-first, drill to supporting evidence ---- */
function insightExplorer(f, sc) {
  const items = [...sc.themes.map(t => ({ id: t.id, title: t.title, n: t.sessions.length })),
                 { id: "DZ", title: "Dumb-zone threshold", n: sc.dza.detected }];
  const list = items.map(it => `<div class="srow ${state.themeSel === it.id ? "sel" : ""}" data-theme="${it.id}">
      <div class="srow-top"><span class="stitle">${it.title}</span></div>
      <div class="srow-sub">${it.id === "DZ" ? "deterministic aggregate" : "thematic synthesis"} · ${it.n} sessions</div></div>`).join("");
  return `<div class="md">
      <div class="md-list" id="iThemes"><div class="md-listhead"><span>Pattern</span></div>${list}</div>
      <div class="md-detail" id="iDetail">${themeDetail(f, sc)}</div>
    </div>`;
}
function themeDetail(f, sc) {
  const tid = state.themeSel;
  if (tid === "DZ") {
    const dza = sc.dza;
    const rows = f.filter(s => s.dumbZone).sort((a, b) => a.dumbZone.degradedAtTokens - b.dumbZone.degradedAtTokens)
      .map(s => `<div class="tsession"><div class="row"><b>${s.title}</b> <span class="dim">${s.id}</span>
        <span class="spacer" style="flex:1"></span><span class="dim pmono">~${fmtK(s.dumbZone.degradedAtTokens)} ctx</span>
        <a href="#" class="metricslink" data-tometrics="${s.id}">metrics →</a></div></div>`).join("");
    return `<div class="idetail-head"><h2 style="font-size:18px">Dumb-zone threshold</h2>
        <div class="muted" style="margin-top:2px">Deterministic — distribution over per-session degradation points, no 2nd model pass.</div></div>
      <div class="chart" id="cI_dz" style="height:220px"></div>
      <div class="verdict"><span class="lbl">Reads as →</span> ${dza.threshold ? `Quality degrades past <b>~${fmtK(dza.threshold)}</b> context tokens — median of <b>${dza.detected}/${dza.total}</b> sessions.` : "No degradation detected."}</div>
      <h3 class="dh">Sessions behind it</h3>${rows || '<div class="dim">none</div>'}`;
  }
  const t = sc.themes.find(x => x.id === tid);
  if (!t) return `<div class="muted">Select a pattern.</div>`;
  const type = THEME_TYPE[tid];
  const groups = t.sessions.map(s => {
    const rel = s.inferences.filter(i => i.type === type);
    return `<div class="tsession"><div class="row"><b>${s.title}</b> <span class="dim">${s.id} · ${s.tool}</span>
        <span class="spacer" style="flex:1"></span><a href="#" class="metricslink" data-tometrics="${s.id}">metrics →</a></div>
      ${rel.map(infCard).join("") || '<div class="dim" style="font-size:12px">matched on Signals — no per-turn Inference of this type</div>'}</div>`;
  }).join("");
  return `<div class="idetail-head"><h2 style="font-size:18px">${t.title}</h2>
      <div class="muted" style="margin-top:2px">${t.synthesis}</div>${provStamp(THEME_STAMP)}</div>
    <h3 class="dh">${t.sessions.length} sessions · supporting ${INFMETA[type].label.toLowerCase()} evidence</h3>${groups}`;
}
function jobsBody() {
  const jobs = [
    {stage:"import",   title:"Import sessions",         desc:"Normalise Claude/Codex/pi transcripts → Postgres", last:"2h ago", st:"idle"},
    {stage:"analysis", title:"Extract signals",         desc:"Derive the 8 deterministic Signals per session",   last:"2h ago", st:"idle"},
    {stage:"analysis", title:"Infer course-corrections",desc:"LLM pass via agent CLI, headless in-container",     last:"never",  st:"idle"},
    {stage:"analysis", title:"Thematic synthesis",      desc:"Map-reduce over Signals + per-session Inferences",  last:"never",  st:"idle"},
  ];
  const byStage = {}; jobs.forEach(j => (byStage[j.stage] ||= []).push(j));
  const card = j => `<div class="card" style="min-height:120px">
    <div class="row"><h3 style="text-transform:none;color:var(--ink);font-size:14px">${j.title}</h3>
      <span class="spacer" style="flex:1"></span><span class="badge" style="background:var(--panel2);color:var(--muted)">${j.st}</span></div>
    <div class="hint">${j.desc}</div>
    <div class="row" style="margin-top:auto"><span class="dim" style="font-size:11.5px">last run: ${j.last}</span>
      <span class="spacer" style="flex:1"></span><button class="pill on" style="cursor:pointer">Trigger →</button></div></div>`;
  const stageBlock = (name, list) => `<div style="margin-bottom:22px">
    <div class="flabel" style="margin-bottom:8px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)">${name}</div>
    <div class="grid">${list.map(j => `<div class="col2">${card(j)}</div>`).join("")}</div></div>`;
  return `<div style="max-width:1040px">
    <div class="row" style="margin-bottom:6px"><h2 style="color:var(--ink)">Jobs</h2>
      <span class="spacer" style="flex:1"></span><button class="pill on" style="cursor:pointer">Run pipeline (import → analysis) →</button></div>
    <p class="dim" style="margin-bottom:18px">Self-describing job containers discovered by label (#5). The web app is the control plane — every run is an explicit action.</p>
    ${Object.entries(byStage).map(([s, l]) => stageBlock(s, l)).join("")}</div>`;
}

/* =====================================================================
   VARIANT B — MASTER-DETAIL SESSION LIST
   List-first: scannable session rows (badges + latency sparkline) on the left,
   full per-session Signal breakdown on the right. Primary affordance: browse &
   inspect one session deeply. Coordination: detail has its own Metrics|Retro tab.
   ===================================================================== */
function sessionsBody(f, a) {
  const rows = f.map(s => {
    const tt = s.tokens.in + s.tokens.out;
    return `<div class="srow ${s.id===state.selected?"sel":""}" data-id="${s.id}">
      <div><div class="top"><span class="badge ${s.tool}">${s.tool}</span>
        <span class="title">${s.title}</span></div>
        <div class="meta">${s.start.toISOString().slice(0,10)} · ${s.turns} turns · ${fmtK(tt)} tok · ${fmtMin(s.durationMin)}${s.subagents.count?` · ${s.subagents.count} sub`:""}</div></div>
      <div class="spark" id="spk_${s.id}"></div></div>`;
  }).join("");
  return `
    <div class="md">
      <div class="md-list">
        <div class="md-agg">
          <div><div class="k">Sessions</div><div class="v">${a.sessions}</div></div>
          <div><div class="k">Tokens</div><div class="v">${fmtK(a.totalTokens)}</div></div>
          <div><div class="k">Turns</div><div class="v">${a.turns}</div></div>
          <div><div class="k">Active time</div><div class="v">${fmtMin(Math.round(a.activeMs/60000))}</div></div>
        </div>
        <div class="md-listhead"><span>Session</span><span class="spacer" style="flex:1"></span><span>latency</span></div>
        <div class="md-rows" id="mdRows">${rows}</div>
      </div>
      <div class="md-detail" id="mdDetail"></div>
    </div>`;
}
function wireSessions(f) {
  f.forEach(s => chartSpark(byId("spk_"+s.id), s));
  byId("mdRows").querySelectorAll(".srow").forEach(r =>
    r.onclick = () => { state.selected = r.dataset.id; render(); });
  renderDetail(f.find(s => s.id === state.selected));
}
function renderDetail(s) {
  if (!s) { byId("mdDetail").innerHTML = `<div class="muted">No session in scope.</div>`; return; }
  const A = agg([s]);
  const tt = s.tokens.in + s.tokens.out;
  const basis = s.tokens.basis === "reconstructed"
    ? `<span class="basis-recon" title="Reconstructed by diffing — not exact">reconstructed</span>` : "exact";
  byId("mdDetail").innerHTML = `
    <div class="row"><span class="badge ${s.tool}">${s.tool}</span>
      <h2 style="font-size:19px">${s.title}</h2>
      <span class="spacer" style="flex:1"></span>
      <div class="viewtabs"><button class="on">Metrics</button><button data-detailretro="${s.id}">Open in Insights</button></div></div>
    <div class="muted" style="margin-top:4px">${s.id} · ${s.start.toISOString().replace("T"," ").slice(0,16)} UTC · ${s.kind}${s.kind==="root"&&s.subagents.count?` · ${s.subagents.count} subagents`:""}</div>
    <div class="detail-grid">
      <div class="card"><h3>Turn count</h3><div class="kpi">${s.turns}<small>turns</small></div></div>
      <div class="card"><h3>Token usage · ${basis}</h3><div class="kpi">${fmtK(tt)}</div>
        <div class="hint">in ${fmtK(s.tokens.in)} · out ${fmtK(s.tokens.out)} · cache ${fmtK(s.tokens.cache)}</div></div>
      <div class="card"><h3>Duration</h3><div class="kpi">${fmtMin(s.durationMin)}</div>
        <div class="hint">active ${fmtMin(Math.round(s.activeMs/60000))} (${Math.round(s.activeMs/60000/s.durationMin*100)}% of wall)</div></div>
      <div class="card"><h3>Subagent usage</h3><div class="kpi">${s.subagents.count}<small>children</small></div>
        <div class="hint">${fmtK(s.subagents.tokens)} tok · ${tt?Math.round(s.subagents.tokens/(tt+s.subagents.tokens)*100):0}% of tree</div></div>
      <div class="card"><h3>Model mix</h3><div class="chart" id="d_mix" style="height:180px"></div></div>
      <div class="card"><h3>Tool usage</h3><div class="chart" id="d_tools" style="height:180px"></div></div>
      <div class="card" style="grid-column:span 2">
        <div class="row"><h3>Response latency by hour</h3><span class="spacer" style="flex:1"></span>
          <div class="toggle" id="d_latToggle">
            <button data-mode="raw" class="${state.latencyMode==="raw"?"on":""}">avg latency</button>
            <button data-mode="perToken" class="${state.latencyMode==="perToken"?"on":""}">per output-token</button>
          </div></div>
        <div class="chart" id="d_lat" style="height:200px"></div></div>
    </div>`;
  chartModelMix(byId("d_mix"), A);
  chartTools(byId("d_tools"), A);
  chartLatencyHour(byId("d_lat"), A, state.latencyMode);
  byId("d_latToggle").querySelectorAll("button").forEach(b =>
    b.onclick = () => { state.latencyMode = b.dataset.mode; renderDetail(s); });
  byId("mdDetail").querySelector("[data-detailretro]").onclick = () => { state.view = "insights"; render(); };
}

/* =====================================================================
   OVERVIEW (question-driven) — shared by variant C and the Synthesis.
   Organised by the HYPOTHESES the Signals answer, not by Signal. Latency
   is the hero. Each section ends with a verdict linking to Retro.
   ===================================================================== */
function latStats(a) {
  const ptH = hourSeries(a, "perToken");
  const afternoon = avg(ptH.slice(13,18)), rest = avg(ptH.filter((_,i)=>i<13||i>17));
  return { afternoon, rest, slower: rest ? ((afternoon/rest - 1) * 100) : 0 };
}
function overviewBody(f, a, opts={}) {
  const { afternoon, rest, slower } = latStats(a);
  const drillHint = opts.drill ? `<span class="drilltip" style="margin-left:auto">click a point → open that session</span>` : "";
  return `
    <section class="section" id="q1">
      <div class="q">Is the model slower in the afternoon?</div>
      <div class="sub">Per-response latency bucketed by hour (Europe/London, DST-aware). The <b>per output-token</b> rate is the honest test — it factors out "it simply wrote more."</div>
      <div class="heroband">
        <div class="card"><div class="row"><h3>Latency by hour of day</h3><span class="spacer" style="flex:1"></span>
          <div class="toggle" id="c_latToggle">
            <button data-mode="raw" class="${state.latencyMode==="raw"?"on":""}">avg latency</button>
            <button data-mode="perToken" class="${state.latencyMode==="perToken"?"on":""}">per output-token</button>
          </div></div>
          <div class="chart" id="cC_lat" style="height:300px"></div></div>
        <div class="card"><h3>PM vs rest (per-token)</h3>
          <div class="kpi ${slower>0?"delta up":"delta down"}">${slower>0?"+":""}${slower.toFixed(0)}%</div>
          <div class="hint">13:00–17:00 rate vs the rest of the day. ${afternoon.toFixed(2)} vs ${rest.toFixed(2)} ms/token.</div>
          <div class="chart" id="cC_gauge" style="height:150px"></div></div>
      </div>
      <div class="verdict"><span class="lbl">Reads as →</span> Afternoon per-token latency runs
        <b>${slower.toFixed(0)}% higher</b> in scope. <a href="#" data-toretro>Open in Insights →</a></div>
    </section>
    <section class="section" id="q2">
      <div class="q">Where do my tokens go?</div>
      <div class="sub">Model mix and the subagent share of the whole tree — what's actually consuming the budget.</div>
      <div class="grid"><div class="card col3"><h3>By model</h3><div class="chart" id="cC_mix" style="height:260px"></div></div>
        <div class="card col3"><h3>Root vs subagent tokens</h3><div class="chart" id="cC_sub" style="height:260px"></div>
          <div class="hint">${a.subCount} child sessions · ${fmtK(a.subTokens)} tok delegated</div></div></div>
      <div class="verdict"><span class="lbl">Reads as →</span> Subagents carry
        <b>${a.totalTokens?Math.round(a.subTokens/(a.totalTokens)*100):0}%</b> of tokens. <a href="#" data-toretro>See delegation retro →</a></div>
    </section>
    <section class="section" id="q3">
      <div class="q">What shape are my sessions?</div>
      <div class="sub">Duration vs turns — many short loops or few long grinds? Not a quality headline, a shape axis.</div>
      <div class="card"><div class="row"><h3 style="text-transform:none;color:var(--muted)">Duration vs turns</h3>${drillHint}</div>
        <div class="chart" id="cC_scatter" style="height:320px"></div></div>
      <div class="verdict"><span class="lbl">Reads as →</span> ${fmtMin(Math.round(a.durationMin/Math.max(a.sessions,1)))} median wall per session,
        <b>${Math.round(a.turns/Math.max(a.sessions,1))} turns</b> avg. <a href="#" data-toretro>Loop discipline in Insights →</a></div>
    </section>
    <section class="section" id="q4">
      <div class="q">What's my tooling footprint?</div>
      <div class="sub">Which tools the models reach for, across scope.</div>
      <div class="card"><div class="chart" id="cC_tools" style="height:260px"></div></div>
    </section>`;
}
function wireOverview(f, a, opts={}) {
  const { slower } = latStats(a);
  chartLatencyHour(byId("cC_lat"), a, state.latencyMode);
  gauge(byId("cC_gauge"), slower);
  chartModelMix(byId("cC_mix"), a);
  chartSubagentShare(byId("cC_sub"), a);
  const sc = chartDurationVsTurns(byId("cC_scatter"), f);
  if (opts.drill) sc.on("click", p => opts.drill(p.data[2]));
  chartTools(byId("cC_tools"), a);
  byId("c_latToggle").querySelectorAll("button").forEach(b =>
    b.onclick = () => { state.latencyMode = b.dataset.mode; render(); });
  document.querySelectorAll("[data-toretro]").forEach(el =>
    el.onclick = e => { e.preventDefault(); state.view = "insights"; render(); });
}

/* =====================================================================
   PAGES — routed by the single header nav (Overview | Sessions | Insights | Jobs).
   Chosen design (#7): question-driven Overview (full width, no sidebar) +
   master-detail Sessions. Overview's session-shape scatter drills to Sessions.
   ===================================================================== */
function pageOverview() {
  const f = filtered(); const a = agg(f);
  document.getElementById("app").innerHTML = chrome(overviewBody(f, a, { drill: true }));
  wireChrome();
  wireOverview(f, a, { drill: id => { state.selected = id; state.view = "sessions"; render(); } });
}
function pageSessions() {
  const f = filtered(); const a = agg(f);
  if (!f.find(s => s.id === state.selected)) state.selected = f[0]?.id;
  document.getElementById("app").innerHTML = chrome(sessionsBody(f, a));
  wireChrome();
  wireSessions(f);
}
function pageInsights() {
  const f = filtered();
  const richest = [...f].sort((a, b) => b.inferences.length - a.inferences.length)[0];
  if (!f.find(s => s.id === state.insightSel)) state.insightSel = (richest || f[0] || {}).id;
  const themes = THEMES.map(t => ({ ...t, sessions: f.filter(t.match) })).filter(t => t.sessions.length);
  const themeIds = [...themes.map(t => t.id), "DZ"];
  if (!themeIds.includes(state.themeSel)) state.themeSel = themeIds[0];
  document.getElementById("app").innerHTML = chrome(insightsBody(f));
  wireChrome();
  wireInsights(f);
}
function wireInsights(f) {
  const dza = dumbZoneAggregate(f);
  if (byId("cI_dz")) {
    if (dza.points.length) chartDumbZone(byId("cI_dz"), dza);
    else byId("cI_dz").innerHTML = '<div class="muted" style="padding:24px">No degradation detected in this scope.</div>';
  }
  document.querySelectorAll("[data-ivar]").forEach(b =>
    b.onclick = () => { state.insightVariant = b.dataset.ivar; render(); });
  document.querySelectorAll("#iList .srow").forEach(r =>
    r.onclick = () => { state.insightSel = r.dataset.isel; render(); });
  document.querySelectorAll("#iThemes .srow").forEach(r =>
    r.onclick = () => { state.themeSel = r.dataset.theme; render(); });
  document.querySelectorAll("[data-jump]").forEach(c =>
    c.onclick = e => { e.preventDefault(); state.insightSel = c.dataset.jump; state.insightVariant = "B"; render(); });
  document.querySelectorAll(".evref[data-turn]").forEach(a =>
    a.onclick = e => { e.preventDefault(); document.getElementById("turn-" + a.dataset.turn)?.scrollIntoView({ behavior: "smooth", block: "center" }); });
  document.querySelectorAll("[data-tometrics]").forEach(el =>
    el.onclick = e => { e.preventDefault(); state.selected = el.dataset.tometrics; state.view = "sessions"; render(); });
}
function pageJobs() {
  document.getElementById("app").innerHTML = chrome(jobsBody());
  wireChrome();
}
function avg(arr){ const v = arr.filter(x=>x!=null); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : 0; }
function gauge(el, pct) {
  mk(el, { series:[{ type:"gauge", startAngle:200, endAngle:-20, min:-30, max:60, radius:"100%", center:["50%","70%"],
    progress:{show:true,width:12}, axisLine:{lineStyle:{width:12,color:[[0.5,"#3fb950"],[0.75,"#d29922"],[1,"#f85149"]]}},
    pointer:{width:4}, axisTick:{show:false}, splitLine:{show:false}, axisLabel:{show:false},
    detail:{formatter:v=>(v>0?"+":"")+v.toFixed(0)+"%",fontSize:18,color:"#e6edf3",offsetCenter:[0,"18%"]},
    data:[{value:pct}] }] });
}

/* =====================================================================
   SHARED WIRING + ROUTER (single header nav, no switcher)
   ===================================================================== */
const byId = id => document.getElementById(id);
function wireChrome() {
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { state.view = b.dataset.view; render(); });
  document.querySelectorAll("[data-tool]").forEach(b => b.onclick = () => {
    const t = b.dataset.tool; state.tools.has(t) ? state.tools.delete(t) : state.tools.add(t);
    if (state.tools.size === 0) TOOLS.forEach(x => state.tools.add(x)); render();
  });
  document.querySelectorAll("[data-model]").forEach(b => b.onclick = () => {
    const m = b.dataset.model; state.models.has(m) ? state.models.delete(m) : state.models.add(m); render();
  });
  document.querySelectorAll("[data-days]").forEach(b => b.onclick = () => { state.days = +b.dataset.days; render(); });
}

const PAGES = { overview: pageOverview, sessions: pageSessions, insights: pageInsights, jobs: pageJobs };
function syncURL() {
  const u = new URL(location); u.searchParams.set("view", state.view);
  if (state.view === "insights") u.searchParams.set("insight", state.insightVariant);
  else u.searchParams.delete("insight");
  history.replaceState(null, "", u);
}
function render() {
  disposeCharts();
  (PAGES[state.view] || pageOverview)();
  syncURL();
}
const q0 = new URLSearchParams(location.search);
const v0 = q0.get("view");
if (v0 && PAGES[v0]) state.view = v0;
const i0 = q0.get("insight");
if (i0 && IVAR[i0]) state.insightVariant = i0;
render();
</script>
</body>
</html>
