name: Visual regression

# Runs inside the pinned Playwright image on amd64 runners. CI is the
# authoritative baseline environment: Apple-Silicon Macs cannot reproduce
# native x86 font rasterisation even under emulation, so baselines are
# generated here, not on a laptop. See
# web/docs/adr/0007-self-hosted-visual-regression.md.
#
#   push/pull_request  — compare stories against committed baselines (the gate)
#   workflow_dispatch  — with update=true, regenerate baselines and commit them
#                        back to the branch
on:
  push:
    branches: [main]
    paths: ['web/**']
  pull_request:
    paths: ['web/**']
  workflow_dispatch:
    inputs:
      update:
        description: 'Regenerate and commit baselines'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compare against baselines
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update) }}
        env:
          VISUAL_NATIVE: '1'
        run: pnpm test:visual

      - name: Regenerate baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update }}
        env:
          VISUAL_NATIVE: '1'
        run: pnpm test:visual:update

      - name: Commit regenerated baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update }}
        working-directory: ${{ github.workspace }}
        run: |
          git config --global --add safe.directory '*'
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          find web/src -type d -name __screenshots__ -exec git add {} +
          if git diff --cached --quiet; then
            echo 'Baselines already up to date.'
          else
            git commit -m 'chore(web): regenerate visual baselines [skip ci]'
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          include-hidden-files: true
          path: |
            web/.vitest-attachments/
            web/visual-results.json
          if-no-files-found: ignore
