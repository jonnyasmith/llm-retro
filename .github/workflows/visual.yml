name: Visual regression

# Runs inside the same pinned Playwright image that scripts/visual.mjs uses
# locally, so committed baselines and CI render identically. See
# web/docs/adr/0007-self-hosted-visual-regression.md.
on:
  push:
    branches: [main]
    paths: ['web/**']
  pull_request:
    paths: ['web/**']

jobs:
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run visual regression
        env:
          VISUAL_NATIVE: '1'
        run: pnpm test:visual

      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            web/.vitest-attachments/
            web/visual-results.json
          if-no-files-found: ignore
